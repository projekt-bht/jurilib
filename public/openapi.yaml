servers:
  - url: https://jurilib.de
components:
  schemas:
    create_case:
      type: object
      properties:
        employeeId:
          type: string
        title:
          type: string
        description:
          type: string
    update_case:
      type: object
      properties:
        description:
          type: number
        title:
          type: number
    upload_file:
      type: object
      properties:
        file:
          type: string
        fileName:
          type: string
    create_appointment:
      type: object
      properties:
        dateTimeStart:
          type: string
        duration:
          type: number
    login_employee:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    login_user:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    create_organization:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        email:
          type: string
        type:
          type: string
        priceCategory:
          type: string
        expertiseAreas:
          type: array
          items:
            type: string
          properties:
            '0':
              type: string
            '1':
              type: string
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        averageRating:
          type: number
        numberOfRatings:
          type: number
    update_organization:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        email:
          type: string
        type:
          type: string
        priceCategory:
          type: string
        expertiseAreas:
          type: array
          items:
            type: string
          properties:
            '0':
              type: string
        country:
          type: string
        city:
          type: string
        zipCode:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        averageRating:
          type: number
        numberOfRatings:
          type: number
    create_service:
      type: object
      properties:
        description:
          type: string
        type:
          type: string
        price:
          type: number
    patch_service:
      type: object
      properties:
        title:
          type: string
    login_response:
      type: object
      properties:
        access_token:
          type: string
          description: 'JWT token for authentication'
      required:
        - access_token
    register_user:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    create_employee:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        organizationId:
          type: string
    create_user:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
  requestBodies:
    create_case:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_case'
      description: ''
      required: true
    update_case:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_case'
      description: ''
      required: true
    upload_file:
      content:
        'multipart/form-data:':
          schema:
            $ref: '#/components/schemas/upload_file'
      description: ''
      required: true
    create_appointment:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_appointment'
      description: ''
      required: true
    login_employee:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/login_employee'
      description: ''
      required: true
    login_user:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/login_user'
      description: ''
      required: true
    create_organization:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_organization'
      description: ''
      required: true
    update_organization:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_organization'
      description: ''
      required: true
    create_service:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_service'
      description: ''
      required: true
    patch_service:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/patch_service'
      description: ''
      required: true
    register_user:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/register_user'
      description: ''
      required: true
    create_employee:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_employee'
      description: ''
      required: true
    create_user:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_user'
      description: ''
      required: true
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT access token obtained from /api/authentication/login, sent as a cookie
