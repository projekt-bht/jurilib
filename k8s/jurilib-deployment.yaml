apiVersion: v1
kind: Service
metadata:
  name: jurilib
  labels:
    app: jurilib
spec:
  ports:
    - port: 3000
  selector:
    app: jurilib
    tier: app
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jurilib-pv-claim
  labels:
    app: jurilib
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurilib
  labels:
    app: jurilib
spec:
  selector:
    matchLabels:
      app: jurilib
      tier: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jurilib
        tier: app
    spec:
      containers:
      - image: registry.bht-berlin.de/hdolzycka/cluster/jurilib:v2
        name: jurilib
        env: 
        - name: NEXT_PUBLICK_PASSWORD_LENGTH
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: password_length
        - name: NEXT_PUBLIC_BACKEND_ROOT
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: backend_root
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: openai_api_key
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: openai_base_url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: jwt_secret
        - name: JWT_TTL
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: jwt_ttl
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: database_url
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: node_env
        - name: BREVO_API_KEY
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: brevo_api_key
        - name: BREVO_SENDER_EMAIL
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: brevo_sender_email
        - name: BREVO_SENDER_NAME
          valueFrom:
            secretKeyRef:
              name: jurilib-secrets
              key: brevo_sender_name
        ports:
        - containerPort: 3000
          name: jurilib
        volumeMounts:
        - name: jurilib-persistent-storage
          mountPath: /data # TODO: Change this to the correct path if needed
      volumes:
      - name: jurilib-persistent-storage
        persistentVolumeClaim:
          claimName: jurilib-pv-claim
      imagePullSecrets:
      - name: private-registry-auth